{% extends 'admin_temp/master.html' %}
{% load static %}
{% block content %}
<main class="nxl-container">
    <div class="nxl-content">
        <div class="page-header">
            <div class="page-header-left d-flex align-items-center">
                <div class="page-header-title">
                    <h5 class="m-b-10">Medicines</h5>
                </div>
                <ul class="breadcrumb">
                    <li class="breadcrumb-item"><a href="{% url 'index_view' %}">Home</a></li>
                    <li class="breadcrumb-item"><a href="{% url 'list_medicine_admin' %}">Medicines</a></li>
                    <li class="breadcrumb-item">Update Medicine</li>
                </ul>
            </div>
        </div>
        <div class="main-content">
            <div class="row">
                <div class="col-lg-8 mx-auto">
                    <div class="card stretch stretch-full">
                        <div class="card-header">
                            <h5 class="card-title">Update Medicine</h5>
                        </div>
                        <div class="card-body">
                            <form method="POST" action="">
                                {% csrf_token %}
                                <div class="row">
                                    {% for field in form %}
                                    <div class="col-md-6 mb-3">
                                        <label class="form-label">{{ field.label }}</label>
                                        {{ field }}
                                        {% if field.errors %}
                                            <div class="text-danger mt-1">
                                                {{ field.errors|striptags }}
                                            </div>
                                        {% endif %}
                                    </div>
                                    {% endfor %}
                                </div>
                                <div class="mt-4">
                                    <button type="submit" class="btn btn-primary">Update Medicine</button>
                                    <a href="{% url 'list_medicine_admin' %}" class="btn btn-light">Cancel</a>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>
{% endblock %}
